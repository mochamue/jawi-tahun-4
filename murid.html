<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumba Hamzah 3D – Murid</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10243f;--card:#fff;--ink:#17233a;--acc:#ff9f1c;--ok:#2ec27e;--bad:#e5484d}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:var(--bg);color:#fff;touch-action:manipulation}
#c{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(#1b4b8a,#10243f);overflow:auto;text-align:center}
.scr.on{display:flex}.card{background:var(--card);color:var(--ink);border-radius:16px;padding:16px;width:min(440px,100%)}
h1{margin:0;font-size:26px}input{width:100%;font-size:18px;padding:10px;border-radius:10px;border:2px solid #ccd;margin:6px 0}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--acc);color:#222;cursor:pointer}button.g{background:var(--ok);color:#fff}
.sw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}.sw i{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;display:grid;place-items:center;font-style:normal;background:#eef}.sw i.s{border-color:#222}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:none;justify-content:space-between;padding:8px 12px;font-weight:700;pointer-events:none;text-shadow:0 1px 3px #000}
#bar{position:fixed;left:10%;right:10%;top:calc(34px + env(safe-area-inset-top,0px));height:8px;background:#0006;border-radius:6px;display:none}#bar b{display:block;height:100%;width:0;background:var(--acc);border-radius:6px}
#ctl{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:none;justify-content:space-between;padding:12px}#ctl button{width:62px;height:62px;border-radius:50%;font-size:24px;opacity:.85;padding:0;user-select:none;-webkit-user-select:none}#ctl{align-items:flex-end}
#q{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px}#q .card{text-align:center}
.jw{font-family:'Noto Naskh Arabic',serif;font-size:44px;direction:rtl;line-height:1.5;margin:4px 0}
.opt{display:block;width:100%;margin:8px 0;background:#e8eefc;color:var(--ink)}.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--bad);color:#fff}
.row{display:flex;align-items:center;gap:8px;background:#ffffff18;border-radius:10px;padding:6px 10px;margin:4px 0;width:100%;text-align:left}
#pl{width:min(460px,100%);max-height:45vh;overflow:auto}#live{position:fixed;right:8px;top:calc(48px + env(safe-area-inset-top,0px));width:190px;display:none;font-size:12px;max-height:60vh;overflow:auto}
#cd{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:90px;font-weight:800;text-shadow:0 4px 12px #000;pointer-events:none;text-align:center}
.dot{width:14px;height:14px;border-radius:50%;flex:none}#err{color:#e5484d;font-size:14px;min-height:18px}
#endb,#sbtn{position:fixed;left:8px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;padding:14px 20px;z-index:5}#lobbymsg{position:fixed;left:8px;right:8px;top:calc(50px + env(safe-area-inset-top,0px));display:none;text-align:center;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas><div id="hud"><span id="hn"></span><span id="hs"></span></div><div id="bar"><b></b></div><div id="live"></div><div id="cd"></div>
<div id="ctl"><div><button id="bl">◀</button> <button id="br">▶</button></div><button id="bj">⬆</button><div id="vz"><button id="bu">▲</button> <button id="bd">▼</button></div></div><button id="sbtn" class="g">▶ Mula Perlumbaan</button><button id="endb" class="g">Tamat Permainan</button><div id="lobbymsg"></div>
<div id="q"><div class="card"><div id="qt"></div><div class="jw" id="qj"></div><div id="qo"></div></div></div>
<div class="scr on" id="s1"><h1>🏃 Lumba Hamzah 3D</h1><div class="card">
<b>Nama anda</b><input id="nm" maxlength="14" placeholder="Taip nama…">
<b>Warna</b><div class="sw" id="sc"></div><b>Gaya kepala</b><div class="sw" id="sh"></div>
<div id="err"></div><button class="g" id="go" style="width:100%">Masuk Lobi</button></div></div>
<div class="scr" id="s3" style="background:#10243fee"><h1>🏆 Carta Markah</h1><div id="lb" style="width:min(460px,100%)"></div><div style="font-size:13px;opacity:.8">Betul +10, salah −5, bonus tamat awal (+30/+20/+15/+10/+5).</div><button id="csv" style="display:none">⬇ Simpan keputusan (CSV)</button></div>
<script>
(function(){
var libs=[['THREE',['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js']],['Peer',['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js']]];
function ld(u){return new Promise(function(r){var s=document.createElement('script');s.src=u;s.onload=function(){r(1)};s.onerror=function(){r(0)};document.head.appendChild(s)})}
function err(m){var d=document.getElementById('errov');if(!d){d=document.createElement('div');d.id='errov';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;padding:10px;background:#e5484d;color:#fff;font-size:14px';document.body.appendChild(d)}d.textContent=m}
window.onerror=function(m,u,l){err('Ralat: '+m+' (baris '+l+')')};
(async function(){for(var i=0;i<libs.length;i++){var ok=0;for(var j=0;j<libs[i][1].length&&!ok;j++){ok=await ld(libs[i][1][j]);if(ok&&!window[libs[i][0]])ok=0}if(!ok){err('Gagal memuatkan '+libs[i][0]+'. Semak sambungan internet dan muat semula.');return}}
main()})();
})();
async function main(){
const isT=false;
const $=id=>document.getElementById(id),PREFIX='hamzahT4-';
const COLS=['#e5484d','#ff9f1c','#2ec27e','#3b82f6','#a855f7','#ec4899'],HATS=['⚪','🎩','👑','🎀'];
const W=[['إسلام','Islam',0],['إستنبول','Istanbul',0],['إي-ميل','e-mel',0],['مسئلة','masalah',1],['تهنيئة','tahniah',1],['ملائكة','malaikat',1],['دعاء','doa',2],['انبياء','anbia',2],['علماء','ulama',2],['وضوء','wuduk',2]];
const POS=['Awal perkataan','Tengah perkataan','Akhir perkataan'];
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const Q=sh(W.flatMap(w=>{const o=sh(W.filter(x=>x!==w)).slice(0,3).map(x=>x[1]).concat(w[1]);
 return[{t:'Hamzah (ء) pada perkataan ini berada di…',j:w[0],o:POS,a:w[2]},{t:'Perkataan Jawi ini dibaca…',j:w[0],o:sh(o),r:w[1]}]}));
Q.forEach(q=>{if(q.a==null)q.a=q.o.indexOf(q.r)});
const N=20,GAP=10,L=(N+1)*GAP+14,FIN=-L,BONUS=[30,20,15,10];
let state='boot',goAt=0,list=[],selfId=null,me={n:'',c:0,h:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color('#8fd3ff');S.fog=new THREE.Fog('#8fd3ff',30,110);
const cam=new THREE.PerspectiveCamera(60,1,.1,200);S.add(new THREE.HemisphereLight('#fff','#6a8',1));
const dl=new THREE.DirectionalLight('#fff',.6);dl.position.set(5,12,5);S.add(dl);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const bx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);S.add(m);return m};
bx(11,1,L+30,'#5b6b8c',0,-.5,-L/2+8);bx(200,1,L+60,'#58b368',0,-1.5,-L/2);bx(200,1,40,'#58b368',0,-1.5,50);bx(26,1,30,'#7c5cc4',0,-.5,40);{const t=lab('LOBI – MENUNGGU GURU','#fff',8);t.position.set(0,5,27);S.add(t)}
for(let i=0;i<L/4;i++)bx(.2,.02,2,'#fff',0,.01,-i*4);
function lab(t,col,w){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='#000a';g.fillRect(0,0,256,64);g.fillStyle=col||'#fff';g.font='bold 32px sans-serif';g.textAlign='center';g.fillText(t,128,44);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(w||2.4,(w||2.4)/4,1);return s}
const hurdles=[];
for(let i=0;i<N;i++){const z=-(i+1)*GAP,g=new THREE.Group();[-5,5].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.5,4,.5),M('#ff9f1c'));p.position.set(x,2,0);g.add(p)});
 const b=new THREE.Mesh(new THREE.BoxGeometry(11,1,.5),M('#ffd166'));b.position.y=4;g.add(b);const l=lab('Soalan '+(i+1));l.position.y=5;g.add(l);g.position.z=z;S.add(g);
 const hz=z-GAP/2-1,hx=[-2.5,0,2.5][(i*7+3)%3];bx(3.4,1,.6,'#e5484d',hx,.5,hz);hurdles.push({x:hx,z:hz})}
bx(11,.05,2,'#222',0,.03,FIN);bx(11,1.2,.4,'#fff',0,5,FIN);const fl=lab('GARIS PENAMAT','#ffd166',6);fl.position.set(0,5.8,FIN);S.add(fl);
function mkChar(c,h,n){const g=new THREE.Group(),a=(geo,col,x,y,z)=>{const m=new THREE.Mesh(geo,M(col));m.position.set(x,y,z);g.add(m);return m};
 a(new THREE.BoxGeometry(.8,1,.5),COLS[c],0,1.1,0);a(new THREE.SphereGeometry(.38,12,10),'#f3c9a0',0,1.9,0);[-.2,.2].forEach(x=>a(new THREE.BoxGeometry(.3,.7,.3),'#334',x,.35,0));
 if(h==1)a(new THREE.CylinderGeometry(.25,.3,.5,10),'#222',0,2.4,0);if(h==2)a(new THREE.ConeGeometry(.35,.4,6),'#ffd166',0,2.4,0);if(h==3){const t=a(new THREE.TorusGeometry(.3,.08,6,12),'#ec4899',0,2.3,0);t.rotation.x=1.4}
 const l=lab(n);l.position.y=3;g.add(l);S.add(g);return g}
const P={x:0,y:0,vy:0,z:0,s:0,q:0,f:null,wait:false,stun:0,mesh:null,run:false,t0:0},others={};
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id));
 const g=['lobby','play','watch'].includes(state);$('hud').style.display=g?'flex':'none';$('bar').style.display=state==='play'||state==='watch'?'block':'none';$('live').style.display=g?'block':'none';
 $('ctl').style.display=!isT&&(state==='lobby'||state==='play')?'flex':'none';$('vz').style.visibility=state==='lobby'?'visible':'hidden';
 $('sbtn').style.display=isT&&state==='lobby'?'block':'none';$('endb').style.display=state==='watch'?'block':'none';
 $('lobbymsg').style.display=state==='lobby'?'block':'none';$('lobbymsg').textContent=isT?'Lobi: tunggu semua pemain masuk. Tekan "Mula Perlumbaan" bila sedia.':'Anda dalam lobi. Bergerak bebas sementara guru memulakan perlumbaan!'}
if($('sc')){COLS.forEach((c,i)=>{const e=document.createElement('i');e.style.background=c;e.onclick=()=>{me.c=i;mark()};$('sc').append(e)});HATS.forEach((c,i)=>{const e=document.createElement('i');e.textContent=c;e.onclick=()=>{me.h=i;mark()};$('sh').append(e)})}
function mark(){if(!$('sc'))return;[...$('sc').children].forEach((e,i)=>e.classList.toggle('s',i==me.c));[...$('sh').children].forEach((e,i)=>e.classList.toggle('s',i==me.h))}mark();
function board(){const all=list.map(a=>({...a})),fin=all.filter(a=>a.f!=null).sort((a,b)=>a.f-b.f);all.forEach(a=>{const r=fin.indexOf(a);a.b=r<0?0:(BONUS[r]??5);a.t=Math.max(0,a.s+a.b)});return all}
function renderLive(){$('live').innerHTML=board().sort((a,b)=>a.z-b.z).map(a=>`<div class="row" style="padding:3px 6px;margin:2px 0"><span class="dot" style="background:${COLS[a.c||0]};width:10px;height:10px"></span><span style="flex:1;overflow:hidden;white-space:nowrap">${esc(a.n)}${a.f!=null?' 🏁':''}</span><b>${a.s}</b></div>`).join('')}
function renderFinal(){const b=board().sort((a,c)=>c.t-a.t);window._fin=b;$('lb').innerHTML=b.map((a,i)=>`<div class="row"><b>${i+1}</b><span class="dot" style="background:${COLS[a.c||0]}"></span><span style="flex:1">${esc(a.n)}${a.id===selfId?' ⭐':''}</span><span style="font-size:12px;opacity:.8">${a.s}${a.b?' +'+a.b:''}</span><b style="font-size:20px">${a.t}</b></div>`).join('')}
function syncMeshes(){list.forEach(p=>{if(p.id===selfId)return;let o=others[p.id];if(!o)o=others[p.id]={m:mkChar(p.c||0,p.h||0,p.n)};o.d=p});
 Object.keys(others).forEach(k=>{if(!list.find(p=>p.id===k)){S.remove(others[k].m);delete others[k]}})}
function onList(){syncMeshes();if(['lobby','play','watch'].includes(state))renderLive();if(state==='final')renderFinal()}
function finish(){if(state==='final')return;state='final';$('q').style.display='none';$('cd').style.display='none';show('s3');renderFinal();if(isT)$('csv').style.display=''}
$('csv').onclick=()=>{const rows=['Kedudukan,Nama,Markah soalan,Bonus,Jumlah'].concat((window._fin||[]).map((a,i)=>[i+1,'"'+a.n.replace(/"/g,'')+'"',a.s,a.b,a.t].join(',')));
 const u=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='keputusan-hamzah.csv';a.click()};
function startRace(){if(!isT){P.x=(Math.random()-.5)*8;P.z=0;P.y=0;P.vy=0;P.q=0;P.s=0;P.f=null}state=isT?'watch':'play';show('');P.run=false;const cd=$('cd');cd.style.display='flex';
 const iv=setInterval(()=>{const r=Math.ceil((goAt-Date.now())/1000);if(r>0)cd.textContent=r;else{cd.textContent='MULA!';P.run=true;P.t0=Date.now();setTimeout(()=>{if(state!=='final')cd.style.display='none'},700);clearInterval(iv)}},100)}
const K={};addEventListener('keydown',e=>{K[e.key]=1;if(e.key===' '){e.preventDefault();jump()}if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>K[e.key]=0);
function hold(id,k){const e=$(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();K[k]=1});['pointerup','pointerleave','pointercancel'].forEach(v=>e.addEventListener(v,()=>K[k]=0))}
hold('bl','ArrowLeft');hold('br','ArrowRight');hold('bu','ArrowUp');hold('bd','ArrowDown');$('bj').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
function jump(){if(P.y<=.01&&!P.wait&&(P.run||state==='lobby'))P.vy=8.5}
function ask(i){P.wait=true;const q=Q[i];$('q').style.display='flex';$('qt').innerHTML=`<b>Soalan ${i+1}/${N}</b><br>${q.t}`;$('qj').textContent=q.j;$('qo').innerHTML='';
 q.o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{[...$('qo').children].forEach(x=>x.onclick=null);const ok=k===q.a;b.classList.add(ok?'ok':'no');if(!ok)$('qo').children[q.a].classList.add('ok');
  P.s=Math.max(0,P.s+(ok?10:-5));P.q=i+1;setTimeout(()=>{$('q').style.display='none';P.wait=false},ok?600:1100)};$('qo').append(b)})}
let last=performance.now();
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
 const dx=(K.ArrowRight||K.d?1:0)-(K.ArrowLeft||K.a?1:0),dz=(K.ArrowDown||K.s?1:0)-(K.ArrowUp||K.w?1:0);
 if(!isT&&state==='lobby'){P.x=Math.max(-12,Math.min(12,P.x+dx*7*dt));P.z=Math.max(27,Math.min(53,P.z+dz*7*dt));P.vy-=22*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0&&P.vy<0)P.vy=0}
 else if(!isT&&state==='play'&&P.run&&P.f==null){
  if(!P.wait){P.z-=(P.stun>0?2:7)*dt;P.stun-=dt;P.x=Math.max(-4.5,Math.min(4.5,P.x+dx*7*dt));
   hurdles.forEach(h=>{if(Math.abs(P.z-h.z)<.6&&Math.abs(P.x-h.x)<1.9&&P.y<.9&&P.stun<=0){P.stun=.8;P.z+=2.5}});
   if(P.q<N&&P.z<=-(P.q+1)*GAP+.5){P.z=-(P.q+1)*GAP+.5;ask(P.q)}else if(P.q>=N&&P.z<=FIN){P.f=Date.now()-P.t0;P.z=FIN;sendNow()}}
  P.vy-=22*dt;P.y=Math.max(0,P.y+P.vy*dt);if(P.y===0&&P.vy<0)P.vy=0}
 if(P.mesh){P.mesh.position.set(P.x,P.y,P.z);P.mesh.rotation.z=P.stun>0?Math.sin(now/40)*.3:0}
 let lead=P.z,mz=0;
 Object.values(others).forEach(o=>{const d=o.d,m=o.m;if(!d)return;m.position.x+=((d.x||0)-m.position.x)*.3;m.position.y+=((d.y||0)-m.position.y)*.4;m.position.z+=((d.z||0)-m.position.z)*.3;mz=Math.min(mz,m.position.z)});
 if(isT){if(state==='lobby'){cam.position.set(0,24,58);cam.lookAt(0,0,38)}else{lead=mz;cam.position.set(9,9,lead+10);cam.lookAt(0,1,lead-6)}}
 else if(state==='lobby'){cam.position.set(P.x*.5,8,P.z+13);cam.lookAt(P.x*.5,0,P.z-3)}
 else{cam.position.set(P.x*.6,5,P.z+9);cam.lookAt(P.x*.6,1.6,P.z-6)}
 if(['lobby','play','watch'].includes(state)){$('hn').textContent=isT?(state==='lobby'?'👩‍🏫 Lobi • '+list.length+' pemain':'👩‍🏫 Pantau langsung'):me.n;
  $('hs').textContent=isT?'':state==='lobby'?'⏳ Menunggu guru':(P.f!=null?'🏁 Tamat! Menunggu yang lain… ':'')+`⭐ ${P.s} • ${P.q}/${N}`;$('bar').firstChild.style.width=Math.min(100,(-lead/L*100))+'%'}
 R.render(S,cam)}
loop();
let peer,conn,joined=0;
function sendNow(){if(conn&&conn.open&&joined)conn.send({t:'st',st:{z:+P.z.toFixed(2),x:+P.x.toFixed(2),y:+P.y.toFixed(2),s:P.s,q:P.q,f:P.f}})}
setInterval(sendNow,120);
const bil=(new URLSearchParams(location.search).get('bilik')||'utama').toLowerCase().replace(/[^a-z0-9]/g,''),HOST=PREFIX+bil;
function tryC(){joined=0;conn=peer.connect(HOST,{reliable:true});
 conn.on('open',()=>{joined=1;conn.send({t:'join',n:me.n,c:me.c,h:me.h,x:+P.x.toFixed(2),z:+P.z.toFixed(2)});if(state==='boot'){state='lobby';show('')}});
 conn.on('data',m=>{if(m.t!=='all')return;list=m.players;if(m.goIn!=null&&!goAt&&state==='lobby'){goAt=Date.now()+m.goIn;startRace()}onList();if(m.end)finish()});
 conn.on('close',()=>{joined=0;if(state!=='final'){$('cd').style.display='flex';$('cd').textContent='Terputus. Menyambung semula…';setTimeout(()=>{$('cd').style.display='none';tryC()},3000)}})}
$('go').onclick=()=>{me.n=($('nm').value||'Pemain').trim().slice(0,14);$('go').disabled=true;$('err').textContent='Menyambung…';
 P.x=(Math.random()-.5)*16;P.z=30+Math.random()*18;P.mesh=mkChar(me.c,me.h,me.n);
 peer=new Peer();peer.on('error',e=>{if(e.type==='peer-unavailable'){$('err').textContent='Guru belum membuka bilik. Menunggu…';setTimeout(tryC,3000)}else $('err').textContent='Ralat sambungan: '+e.type});
 peer.on('open',id=>{selfId=id;tryC()})};

}</script></body></html>
